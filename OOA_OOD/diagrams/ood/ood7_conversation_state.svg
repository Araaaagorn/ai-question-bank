<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1910px;height:460px;background:#FFFFFF;" width="1910px" height="460px" viewBox="0 0 1910 460" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Busy" id="ent0001" data-source-line="20"><rect x="1003.68" y="228.8" width="375.44" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1003.68" y1="271.394" x2="1379.12" y2="271.394" style="stroke:#181818;stroke-width:0.5;"/><text x="1129.938" y="246.795" fill="#000" font-size="14" textLength="56">任务占用</text><text x="1129.938" y="263.092" fill="#000" font-size="14" textLength="122.923">(已锁定进行中任务)</text><text x="1008.68" y="289.389" fill="#000" font-size="14" textLength="355.44">查询任务(任务标识, 归属用户) / 返回任务视图，状态不变</text></g><g class="entity" data-qualified-name="Idle" id="ent0002" data-source-line="23"><rect x="381.91" y="13.81" width="454.989" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="381.91" y1="56.404" x2="836.899" y2="56.404" style="stroke:#181818;stroke-width:0.5;"/><text x="561.943" y="31.805" fill="#000" font-size="14" textLength="60.45">活跃·空闲</text><text x="561.943" y="48.102" fill="#000" font-size="14" textLength="94.923">(无进行中任务)</text><text x="386.91" y="74.399" fill="#000" font-size="14" textLength="355.44">查询任务(任务标识, 归属用户) / 返回任务视图，状态不变</text><text x="386.91" y="90.696" fill="#000" font-size="14" textLength="434.989">校验追问受理(教学模式) 被拒 / 返回拒绝原因，状态与对话历史均不变</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="28"><ellipse cx="1414.4" cy="56.4" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0007" data-source-line="34"><ellipse cx="580.4" cy="409.95" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="580.4" cy="409.95" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="39"><path d="M871.51,6 L871.51,52.4 L837.29,56.4 L871.51,60.4 L871.51,106.797 A0,0 0 0 0 871.51,106.797 L1255.304,106.797 A0,0 0 0 0 1255.304,106.797 L1255.304,16 L1245.304,6 L871.51,6 A0,0 0 0 0 871.51,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1245.304,6 L1245.304,16 L1255.304,16 L1245.304,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="877.51" y="23.067" fill="#000" font-size="13" textLength="338.47">“校验追问受理”被拒的四类原因（均不改变状态与历史）：</text><text x="877.51" y="38.2" fill="#000" font-size="13" textLength="359.157">同对话切换教学模式 / 教师配置版本变化导致凭证作用域失效 /</text><text x="877.51" y="53.333" fill="#000" font-size="13" textLength="309.569">历史超过 12 轮或 64KB / 对话已被进行中任务占用。</text><text x="877.51" y="68.465" fill="#000" font-size="13" textLength="315.32">hint 模式的提示层级在每次受理时按历史成功轮数重算</text><text x="877.51" y="83.598" fill="#000" font-size="13" textLength="262.831">（1→2→3，失败与取消不升级），见图2-9。</text><text x="877.51" y="98.731" fill="#000" font-size="13" textLength="362.794">可达性检查（p37）：两个状态均可达且均可离开，无死状态。</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="48"><path d="M1005.17,374.69 L1005.17,445.221 A0,0 0 0 0 1005.17,445.221 L1377.64,445.221 A0,0 0 0 0 1377.64,445.221 L1377.64,384.69 L1367.64,374.69 L1195.4,374.69 L1191.4,298.17 L1187.4,374.69 L1005.17,374.69 A0,0 0 0 0 1005.17,374.69" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1367.64,374.69 L1367.64,384.69 L1377.64,384.69 L1367.64,374.69" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1011.17" y="391.757" fill="#000" font-size="13" textLength="351.47">对话销毁后客户端再引用该对话标识将被视为“对话不存在”，</text><text x="1011.17" y="406.89" fill="#000" font-size="13" textLength="314.888">需新建对话（前端处置见《03》§3.1.6.2 与图3-4）。</text><text x="1011.17" y="422.023" fill="#000" font-size="13" textLength="332.364">本图与图2-12（AI 解答任务状态图）正交：任务到达终态</text><text x="1011.17" y="437.155" fill="#000" font-size="13" textLength="296.76">正是“任务占用 → 活跃·空闲”转换的触发事件来源。</text></g><!--link *start* to Busy--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="28" data-link-type="dependency"><path d="M1414.63,66.73 C1414.72,91.64 1411.49,160.37 1375.4,198.8 C1364.19,210.75 1355.013,218.071 1340.383,225.941" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Busy"/><polygon points="1335.98,228.31,1345.801,227.569,1340.383,225.941,1342.011,220.524,1335.98,228.31" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1593.656" y="157.367" fill="#000" font-size="13" textLength="114.144">受理任务(提交请求)</text><text x="1412.618" y="172.5" fill="#000" font-size="13" textLength="476.221">[首次提问，未携带对话标识 ∧ 并发与等待队列未满 ∧ 对话数 &lt; 上限(默认 1000)]</text><text x="1407.4" y="187.633" fill="#000" font-size="13" textLength="486.656">/ 创建对话并绑定归属用户、题目、教学模式与凭证作用域；占用任务锁(新任务标识)</text></g><!--link Busy to Idle--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="30" data-link-type="dependency"><path d="M1003.31,232.24 C994.22,231.03 985.22,229.87 976.4,228.8 C938.65,224.21 663.53,224.4 635.4,198.8 C608.36,174.19 603.593,136.438 604.603,104.368" style="stroke:#181818;stroke-width:1;" fill="none" id="Busy-to-Idle"/><polygon points="604.76,99.37,600.479,108.24,604.603,104.368,608.475,108.491,604.76,99.37" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="720.9" y="157.367" fill="#000" font-size="13" textLength="114.144">关联任务到达终态()</text><text x="666.072" y="172.5" fill="#000" font-size="13" textLength="223.8">/ 释放任务锁()；更新最近活跃时刻()；</text><text x="636.4" y="187.633" fill="#000" font-size="13" textLength="283.144">成功则追加对话历史(消息集)，失败与取消不追加</text></g><!--link Idle to Busy--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="32" data-link-type="dependency"><path d="M802.43,99.43 C861.1,113.51 913.17,127.88 924.4,136.8 C948.7,156.07 932.27,179.32 956.4,198.8 C971.2,210.74 983.491,218.42 1001.231,226.3" style="stroke:#181818;stroke-width:1;" fill="none" id="Idle-to-Busy"/><polygon points="1005.8,228.33,999.199,221.021,1001.231,226.3,995.951,228.332,1005.8,228.33" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1105.034" y="149.867" fill="#000" font-size="13" textLength="114.144">受理任务(提交请求)</text><text x="957.4" y="165" fill="#000" font-size="13" textLength="409.411">[携带对话标识 ∧ 归属同一用户 ∧ 绑定同一题目 ∧ 教学模式一致或省略</text><text x="984.479" y="180.133" fill="#000" font-size="13" textLength="355.253">∧ 凭证作用域未变 ∧ 历史 &lt; 12 轮成功提问 ∧ 历史 ≤ 64KB]</text><text x="985.206" y="195.265" fill="#000" font-size="13" textLength="353.8">/ 创建新任务；占用任务锁(新任务标识)；更新最近活跃时刻()</text></g><!--link Idle to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="34" data-link-type="dependency"><path d="M381.75,95.4 C237.2,124.7 69.34,170.12 25.4,228.8 C7.05,253.31 6,274.01 25.4,297.69 C97.81,386.05 491.484,405.493 564.064,408.353" style="stroke:#181818;stroke-width:1;" fill="none" id="Idle-to-*end*"/><polygon points="569.06,408.55,560.224,404.199,564.064,408.353,559.909,412.193,569.06,408.55" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="26.4" y="267.807" fill="#000" font-size="13" textLength="510.726">after(存活时长，默认 1 小时) [无进行中任务] / 清理过期对象()，从内存登记表移除对话</text></g><!--link Idle to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk9" data-source-line="35" data-link-type="dependency"><path d="M605.64,99.42 C604.58,111.49 603.43,124.66 602.4,136.8 C593.78,238.83 584.44,357.445 581.61,393.585" style="stroke:#181818;stroke-width:1;" fill="none" id="Idle-to-*end*-1"/><polygon points="581.22,398.57,585.91,389.91,581.61,393.585,577.935,389.285,581.22,398.57" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="596.4" y="267.807" fill="#000" font-size="13" textLength="386.788">服务停止() / 丢弃内存中的对话与历史（设计约束：对话不持久化）</text></g><!--link Busy to *end*--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk10" data-source-line="36" data-link-type="dependency"><path d="M1030.53,298.13 C987.83,307.41 941.82,317.68 899.4,327.69 C777.87,356.36 636.24,393.997 595.94,404.787" style="stroke:#181818;stroke-width:1;" fill="none" id="Busy-to-*end*"/><polygon points="591.11,406.08,600.838,407.616,595.94,404.787,598.769,399.888,591.11,406.08" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="900.4" y="340.757" fill="#000" font-size="13" textLength="282.788">服务停止() / 丢弃内存状态，进行中任务一并丢失</text></g><?plantuml-src hLTTKo9N6hxdLvpAJS2iuzSacwIsjcgoUpERYydzw0N9C1bt4vmIDhkfhQrgnW4Q1O4920gCW2Z6aKQDGQ0Hg_9Jd3wdJr_v5_OvVHfiTNPhBjRI0iyv_NuyptFUz-qFoOE77rdr8kt_n3RxVEMSvJTfQu_sVg7f8tAfv0Wj3UScFoMF7lsPS6t8jPgvsc5A1CjNWotQxl5svMgW_caf-4DWEUGFBou5hmO9CxTDi-Sqky_AsvuF2ItlJqomzIPLEzRFntHrtrhPfsfiOa9Qj8eTfltADeve_JMCFdhqW8oTyBsOMTf0X6P98rE8bl3cZjdA6RfELsjO4G5tLVBWguV4YgRCSyte9inZNKHsNBiQ9E6UAqdorIAXiIXj5OrkoznwAGENXrZYWgr5BvKoJUMbMIiN8HyHkXwZwHC-x9dvfFWttkBjY75UDdFxT7lxKgd0ZaoAHvByT4Swez6E39wtMqOlGTC7h9m00ExqRwITI5bbXUz5M7581scgzza-ubRDmyEP-rmx8S_d23mQNGIsBmFcjNspqPS6sQyHns-lGzDPkMXqrv624y3nwxkk1HHQ3qIzLLu8WDf3St_D65POIdDSpy8rza47zWbv_YaHFtWErF7pGxEfOylehncwS0k-ZMwAjWSyVYgpPxaUJHV9PUmL7jf4_d9PGE-o0H6mQXe9u6apfpCrm-C7s6AfkdGxyx5momeTgt0glG4BudyQ3Yo3Ut-OI2oSmxyNX-NZHlU4LGS0z3hCJEgnbwPViFmH7l8jaCTcASjM6wnImox-dG8ye1URV2YeM72iVZOrEqq2mV3oZt0P-ETY61zFbeZHxJigZKLbDZ8vI916Vx5o6cqLf8KvEox9BCsiins5RU_IT1jkcD84MQobIrCupyg7xB1cN6XSgoFsosmLGeJQoloYmfil-SMvLT1u_GrRUoKacDCH1tduvBi0e1OVP8mWO