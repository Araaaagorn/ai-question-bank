<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1210px;height:655px;background:#FFFFFF;" width="1210px" height="655px" viewBox="0 0 1210 655" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Unconfigured" id="ent0001" data-source-line="14"><rect x="169.12" y="103" width="353.046" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="169.12" y1="129.297" x2="522.166" y2="129.297" style="stroke:#181818;stroke-width:0.5;"/><text x="324.643" y="120.995" fill="#000" font-size="14" textLength="42">未配置</text><text x="174.12" y="147.292" fill="#000" font-size="14" textLength="333.046">启停配置(启用) / 拒绝并提示“配置不存在”，状态不变</text><text x="174.12" y="163.589" fill="#000" font-size="14" textLength="207.046">生成脱敏元数据() / 返回“未配置”</text></g><g class="entity" data-qualified-name="Enabled" id="ent0002" data-source-line="18"><rect x="133.11" y="286.69" width="425.069" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="133.11" y1="312.987" x2="558.179" y2="312.987" style="stroke:#181818;stroke-width:0.5;"/><text x="308.419" y="304.685" fill="#000" font-size="14" textLength="74.45">已配置·启用</text><text x="138.11" y="330.982" fill="#000" font-size="14" textLength="348.344">保存配置(密钥, 模型) [密钥与模型格式合法 ∧ 身份匹配]</text><text x="138.11" y="347.279" fill="#000" font-size="14" textLength="376.605">/ 重新加密存储；version := version + 1；写配置变更审计</text><text x="138.11" y="363.576" fill="#000" font-size="14" textLength="405.069">生成脱敏元数据() / 返回已配置、已启用、模型、脱敏 Key、版本</text></g><g class="entity" data-qualified-name="Disabled" id="ent0003" data-source-line="22"><rect x="133.11" y="456.68" width="425.069" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="133.11" y1="482.977" x2="558.179" y2="482.977" style="stroke:#181818;stroke-width:0.5;"/><text x="308.419" y="474.675" fill="#000" font-size="14" textLength="74.45">已配置·停用</text><text x="138.11" y="500.972" fill="#000" font-size="14" textLength="405.069">生成脱敏元数据() / 返回已配置、已停用、模型、脱敏 Key、版本</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="26"><ellipse cx="345.64" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="34"><path d="M592.97,278.89 L592.97,325.29 L558.41,329.29 L592.97,333.29 L592.97,379.687 A0,0 0 0 0 592.97,379.687 L928.3,379.687 A0,0 0 0 0 928.3,379.687 L928.3,288.89 L918.3,278.89 L592.97,278.89 A0,0 0 0 0 592.97,278.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M918.3,278.89 L918.3,288.89 L928.3,288.89 L918.3,278.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="598.97" y="295.957" fill="#000" font-size="13" textLength="299.94">“保存配置”“生成脱敏元数据”不改变对象所处状态，</text><text x="598.97" y="311.09" fill="#000" font-size="13" textLength="119.33">故按第12讲 p8 建为</text><text x="718.3" y="311.09" fill="#000" font-size="13" textLength="52" font-weight="700">内部转移</text><text x="770.3" y="311.09" fill="#000" font-size="13" textLength="143">（原图误画为自转换）。</text><text x="598.97" y="326.223" fill="#000" font-size="13" textLength="299">仅学生与管理员无权访问本配置接口（一律拒绝）；</text><text x="598.97" y="341.355" fill="#000" font-size="13" textLength="305.481">查询只返回脱敏元数据，绝不回显完整 Key 或密文。</text><text x="598.97" y="356.488" fill="#000" font-size="13" textLength="272.746">version 变更会使存量对话的凭证作用域失效，</text><text x="598.97" y="371.621" fill="#000" font-size="13" textLength="272.366">追问被拒（见图3-8 对话状态图的内部转移）。</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="43"><path d="M146.4,570.28 L146.4,640.811 A0,0 0 0 0 146.4,640.811 L544.87,640.811 A0,0 0 0 0 544.87,640.811 L544.87,580.28 L534.87,570.28 L349.64,570.28 L345.64,509.55 L341.64,570.28 L146.4,570.28 A0,0 0 0 0 146.4,570.28" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M534.87,570.28 L534.87,580.28 L544.87,580.28 L534.87,570.28" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="152.4" y="587.347" fill="#000" font-size="13" textLength="247">停用不影响已受理任务：仍可查询与取消。</text><text x="152.4" y="602.48" fill="#000" font-size="13" textLength="52">本状态图</text><text x="204.4" y="602.48" fill="#000" font-size="13" textLength="91" font-weight="700">没有终止伪状态</text><text x="295.4" y="602.48" fill="#000" font-size="13" textLength="214.468">（第12讲 p23）：当前无删除配置的</text><text x="152.4" y="617.613" fill="#000" font-size="13" textLength="377.47">接口，配置对象随教师账号长期保留，不应以终态表达“不终止”。</text><text x="152.4" y="632.745" fill="#000" font-size="13" textLength="362.794">可达性检查（p37）：三个状态均可达且均可离开，无死状态。</text></g><!--link *start* to Unconfigured--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="26" data-link-type="dependency"><path d="M345.64,26.37 C345.64,42.59 345.64,71.66 345.64,97.63" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Unconfigured"/><polygon points="345.64,102.63,349.64,93.63,345.64,97.63,341.64,93.63,345.64,102.63" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="346.64" y="69.067" fill="#000" font-size="13" textLength="413.277">创建教师账号(用户名, 密码) [角色 = teacher] / 建立该教师的配置槽位</text></g><!--link Unconfigured to Enabled--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="28" data-link-type="dependency"><path d="M345.64,172.38 C345.64,204.27 345.64,247.08 345.64,281.35" style="stroke:#181818;stroke-width:1;" fill="none" id="Unconfigured-to-Enabled"/><polygon points="345.64,286.35,349.64,277.35,345.64,281.35,341.64,277.35,345.64,286.35" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="471.67" y="214.957" fill="#000" font-size="13" textLength="122.408">保存配置(密钥, 模型)</text><text x="434.412" y="230.09" fill="#000" font-size="13" textLength="196.924">[密钥与模型格式合法 ∧ 身份匹配]</text><text x="346.64" y="245.223" fill="#000" font-size="13" textLength="372.468">/ 加密存储；version := 1；enabled := true；写配置变更审计</text></g><!--link Enabled to Disabled--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="30" data-link-type="dependency"><path d="M132.85,342.37 C60.14,354.72 6,379.07 45.64,426.68 C59.02,442.76 87.819,453.191 128.009,461.301" style="stroke:#181818;stroke-width:1;" fill="none" id="Enabled-to-Disabled"/><polygon points="132.91,462.29,124.879,456.589,128.009,461.301,123.297,464.431,132.91,462.29" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="46.64" y="422.747" fill="#000" font-size="13" textLength="552.183">启停配置(false) [配置存在] / 解密后重新加密存储；version := version + 1；写审计（停用）</text></g><!--link Disabled to Enabled--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk8" data-source-line="31" data-link-type="dependency"><path d="M541.61,456.24 C570.38,448.66 593.7,438.98 603.64,426.68 C619.01,407.67 585.707,389.977 534.437,373.767" style="stroke:#181818;stroke-width:1;" fill="none" id="Disabled-to-Enabled"/><polygon points="529.67,372.26,537.045,378.787,534.437,373.767,539.457,371.159,529.67,372.26" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="607.64" y="422.747" fill="#000" font-size="13" textLength="586.936">启停配置(true) [配置存在] / 解密后重新加密存储；version := version + 1；写审计（配置或启用）</text></g><?plantuml-src jLPRRnf757xdLupo4eV4eRPLjOsKIb7RXwWlVMYU72iYzYP1JS02qZQgAc4xm6ApBBR1Do20Onla2nixbeDPm59_YhCpEppvB_JCdbsovA8q3xMGF3kNSxxpdM_cdClarkshlSqrsbfcwoq-rs7vTNgmGqzVK_KLEO_b22rqHuT7neWvVy9YC_0rTj7U4BkQCfmbjtwvJNfnnUmqBjhohv9_yf4KlZKT-24KV11uUD5EcRaoNUpGnJehbZsN2TUwPdt1w9QO8WwO-_iZexnn11l1Ag