<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1024px;height:555px;background:#FFFFFF;" width="1024px" height="555px" viewBox="0 0 1024 555" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Published" id="ent0001" data-source-line="15"><rect x="94.19" y="140.81" width="483.14" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="94.19" y1="183.404" x2="577.33" y2="183.404" style="stroke:#181818;stroke-width:0.5;"/><text x="277.196" y="158.805" fill="#000" font-size="14" textLength="42">已发布</text><text x="277.196" y="175.102" fill="#000" font-size="14" textLength="117.127">(status = active)</text><text x="99.19" y="201.399" fill="#000" font-size="14" textLength="463.14">修改题目(待更新字段集) [合并后整体校验通过] / 覆盖被提交字段，id 不变</text><text x="99.19" y="217.696" fill="#000" font-size="14" textLength="220.54">组装题目信息() / 返回对外题目视图</text></g><g class="entity" data-qualified-name="Archived" id="ent0002" data-source-line="20"><rect x="121.19" y="325.8" width="155.153" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="121.19" y1="368.394" x2="276.343" y2="368.394" style="stroke:#181818;stroke-width:0.5;"/><text x="131.19" y="343.795" fill="#000" font-size="14" textLength="42">已归档</text><text x="131.19" y="360.092" fill="#000" font-size="14" textLength="135.153">(status = archived)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="22"><ellipse cx="335.76" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0005" data-source-line="24"><ellipse cx="593.76" cy="352.1" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="593.76" cy="352.1" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="30"><path d="M611.86,133 L611.86,179.4 L577.8,183.4 L611.86,187.4 L611.86,233.797 A0,0 0 0 0 611.86,233.797 L957.676,233.797 A0,0 0 0 0 957.676,233.797 L957.676,143 L947.676,133 L611.86,133 A0,0 0 0 0 611.86,133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M947.676,133 L947.676,143 L957.676,143 L947.676,133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="617.86" y="150.067" fill="#000" font-size="13" textLength="314.8">“修改题目”不改变对象所处状态，故按第12讲 p8 建为</text><text x="617.86" y="165.2" fill="#000" font-size="13" textLength="52" font-weight="700">内部转移</text><text x="669.86" y="165.2" fill="#000" font-size="13" textLength="221">（写在状态分栏内），不画成自转换。</text><text x="617.86" y="180.333" fill="#000" font-size="13" textLength="303.006">系统启动时装载 5 道演示题走同一“创建题目”事件，</text><text x="617.86" y="195.465" fill="#000" font-size="13" textLength="324.816">其 teacherId = 1(admin)，并以 seedKey 幂等防重。</text><text x="617.86" y="210.598" fill="#000" font-size="13" textLength="286.07">读取链路当前不按 status 过滤；AI 解答提交要求</text><text x="617.86" y="225.731" fill="#000" font-size="13" textLength="241.617">status = active，否则视为题目不存在。</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="39"><path d="M6,439.39 L6,540.187 A0,0 0 0 0 6,540.187 L391.527,540.187 A0,0 0 0 0 391.527,540.187 L391.527,449.39 L381.527,439.39 L202.76,439.39 L198.76,378.62 L194.76,439.39 L6,439.39 A0,0 0 0 0 6,439.39" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M381.527,439.39 L381.527,449.39 L391.527,449.39 L381.527,439.39" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="456.457" fill="#000" font-size="13" textLength="350.518">⬜ 目标设计状态（灰色虚线转换）：archived 字段已存在，</text><text x="12" y="471.59" fill="#000" font-size="13" textLength="349.686">但仓库中无任何写入路径（归档为 docs/项目开发时间轴.md</text><text x="12" y="486.723" fill="#000" font-size="13" textLength="364.527">F02 的 P0 需求）。草稿、待审核、审核驳回等状态同样未实现</text><text x="12" y="501.855" fill="#000" font-size="13" textLength="329.177">（学生提交→教师审核流程 F04 为待办，无代码支撑）。</text><text x="12" y="516.988" fill="#000" font-size="13" textLength="362.794">可达性检查（p37）：本图无死状态；已归档仅可经目标设计的</text><text x="12" y="532.121" fill="#000" font-size="13" textLength="325.47">“恢复题目”离开，故与两条虚线转换一并标注为未实现。</text></g><!--link *start* to Published--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="22" data-link-type="dependency"><path d="M335.76,26.37 C335.76,47.9 335.76,96.99 335.76,135.44" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Published"/><polygon points="335.76,140.44,339.76,131.44,335.76,135.44,331.76,131.44,335.76,140.44" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="403.401" y="69.067" fill="#000" font-size="13" textLength="272.467">创建题目(题干, 题型, 选项, 答案, 解析, 知识点)</text><text x="371.323" y="84.2" fill="#000" font-size="13" textLength="336.623">[会话有效 ∧ 角色 ∈ {teacher, admin} ∧ 字段校验通过]</text><text x="336.76" y="99.333" fill="#000" font-size="13" textLength="405.749">/ id := 当前最大 id + 1；status := active；teacherId := 会话用户</text></g><!--link Published to *end*--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk6" data-source-line="24" data-link-type="dependency"><path d="M480.33,226.4 C501.94,236.51 522.92,248.85 540.76,263.8 C566.72,285.55 581.665,318.77 588.485,336.61" style="stroke:#181818;stroke-width:1;" fill="none" id="Published-to-*end*"/><polygon points="590.27,341.28,590.793,331.445,588.485,336.61,583.32,334.302,590.27,341.28" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.56" y="284.367" fill="#000" font-size="13" textLength="440.064">删除题目(题目标识) [题目存在] / 销毁题目对象（该标识再查询视为不存在）</text></g><!--link Published to Archived--><