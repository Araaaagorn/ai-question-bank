<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI+题库智能教学平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header id="navbar" class="navbar hidden">
    <div class="navbar-inner">
      <span class="navbar-brand">AI+题库</span>
      <span class="navbar-user" id="userInfo"></span>
      <button class="btn btn-sm hidden" id="teacherApiNavBtn" onclick="app.openTeacherApi()">AI 配置</button>
      <button class="btn btn-sm" id="logoutBtn" onclick="app.logout()">退出</button>
    </div>
  </header>

  <!-- ====== 登录页 ====== -->
  <div id="page-login" class="page page-center">
    <div class="login-card">
      <h1>AI+题库智能教学平台</h1>
      <p class="login-subtitle">第一阶段 Demo</p>
      <form id="loginForm" onsubmit="return app.login(event)">
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" placeholder="admin / teacher / student" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required />
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
        </div>
        <p class="login-hint">测试账号：admin(管理员) / teacher(老师) / student(学生)<br/>默认密码均为：xxx123</p>
      </form>
      <p id="loginError" class="login-error hidden"></p>
      <p class="auth-switch">还没有账号？<a href="#register">立即注册</a></p>
    </div>
  </div>

  <!-- ====== 注册页 ====== -->
  <div id="page-register" class="page page-center hidden">
    <div class="login-card">
      <h1>注册新账号</h1>
      <p class="login-subtitle">注册成功后将自动登录</p>
      <form id="registerForm" onsubmit="return app.register(event)">
        <div class="form-group">
          <label for="regUsername">用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="regPassword">密码</label>
          <input type="password" id="regPassword" placeholder="至少 8 位，需包含字母和数字" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="regConfirm">确认密码</label>
          <input type="password" id="regConfirm" placeholder="请再次输入密码" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="regRole">角色</label>
          <select id="regRole">
            <option value="student" selected>学生</option>
            <option value="teacher">教师</option>
          </select>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注 册</button>
        </div>
        <p class="login-hint">密码要求：至少 8 位，且同时包含字母和数字</p>
      </form>
      <p id="regError" class="login-error hidden"></p>
      <p class="auth-switch">已有账号？<a href="#login">返回登录</a></p>
    </div>
  </div>

  <!-- ====== 题目列表页 ====== -->
  <div id="page-questions" class="page hidden">
    <div class="container">
      <h2>题目列表</h2>
      <div id="questionsLoading" class="loading">加载中...</div>
      <div id="questionsError" class="error-box hidden">
        <span id="questionsErrorText"></span>
        <button class="btn btn-sm btn-secondary" onclick="app.reloadQuestions()">重试</button>
      </div>
      <div id="questionsList" class="questions-list"></div>
    </div>
  </div>

  <!-- ====== 对话页 ====== -->
  <div id="page-chat" class="page hidden">
    <div class="container chat-layout">
      <div class="chat-header">
        <button class="btn btn-sm" onclick="app.navigate('#questions')">← 返回列表</button>
        <h2 id="chatQuestionTitle">题目详情</h2>
      </div>

      <!-- 题目详情区 -->
      <div id="questionDetail" class="question-detail">
        <div id="detailLoading" class="loading">加载题目中...</div>
        <div id="detailError" class="error-box hidden">
          <span id="detailErrorText"></span>
          <button class="btn btn-sm btn-secondary" onclick="app.retryDetail()">重试</button>
        </div>
        <div id="detailContent" class="hidden">
          <p class="q-content" id="qContent"></p>
          <div id="qOptions" class="q-options"></div>
          <div class="q-meta">
            <span class="q-type" id="qType"></span>
            <span class="q-knowledge" id="qKnowledge"></span>
          </div>
          <details class="q-answer">
            <summary>查看答案与解析</summary>
            <p><strong>答案：</strong><span id="qAnswer"></span></p>
            <p><strong>解析：</strong><span id="qAnalysis"></span></p>
          </details>
        </div>
      </div>

      <!-- 对话区 -->
      <div id="chatMessages" class="chat-messages"></div>

      <div id="aiAccessStatus" class="ai-access-status hidden"></div>

      <div class="chat-input-bar">
        <div class="chat-controls">
          <select id="chatMode" class="chat-mode-select" title="教学模式">
            <option value="solve" selected>完整讲解</option>
            <option value="hint">分层提示</option>
            <option value="review">错因分析</option>
          </select>
          <input type="text" id="chatInput" placeholder="输入你的问题或疑问..." />
          <input type="text" id="studentAnswerInput" class="hidden" placeholder="请输入你的作答或过程..." />
          <button class="btn btn-primary" id="chatSendBtn" onclick="app.sendChat()">发送</button>
          <button class="btn btn-secondary hidden" id="chatCancelBtn" type="button" onclick="app.cancelChat()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 教师 AI API 配置页（仅 teacher 可进入） ====== -->
  <div id="page-teacher-api" class="page hidden">
    <div class="container">
      <div class="chat-header">
        <button class="btn btn-sm" onclick="app.navigate('#questions')">← 返回列表</button>
        <h2>我的 AI API 配置</h2>
      </div>
      <div id="teacherApiLoading" class="loading">加载中...</div>
      <div id="teacherApiError" class="error-box hidden">
        <span id="teacherApiErrorText"></span>
        <button class="btn btn-sm btn-secondary" onclick="app.reloadTeacherApi()">重试</button>
      </div>
      <div id="teacherApiContent" class="hidden">
        <div id="teacherApiStatus" class="teacher-api-status"></div>
        <form id="teacherApiForm" onsubmit="return app.saveTeacherApi(event)">
          <div class="form-group">
            <label for="teacherApiKey">API Key</label>
            <input type="password" id="teacherApiKey" placeholder="粘贴供应商密钥，保存后不再显示" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="teacherApiModel">模型（可选）</label>
            <input type="text" id="teacherApiModel" placeholder="deepseek-flash" autocomplete="off" />
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-block" id="teacherApiSaveBtn">保存并启用</button>
          </div>
        </form>
        <div class="form-group">
          <button class="btn btn-secondary btn-block" id="teacherApiToggleBtn" onclick="app.toggleTeacherApi()" disabled>停用</button>
        </div>
        <p id="teacherApiMsg" class="form-hint hidden"></p>
        <p class="form-hint">密钥只在服务端加密保存，页面仅显示掩码；更换密钥或模型会提升版本号，已提交的任务仍用旧版本完成。</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pi-chat-client.js"></script>
  <script src="/js/questions.js"></script>
  <script src="/js/teacher-api.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
