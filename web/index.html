<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI+题库智能教学平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header id="navbar" class="navbar hidden">
    <div class="navbar-inner">
      <span class="navbar-brand">AI+题库</span>
      <span class="navbar-user" id="userInfo"></span>
      <button class="btn btn-sm" id="logoutBtn" onclick="app.logout()">退出</button>
    </div>
  </header>

  <!-- ====== 登录页 ====== -->
  <div id="page-login" class="page page-center">
    <div class="login-card">
      <h1>AI+题库智能教学平台</h1>
      <p class="login-subtitle">第一阶段 Demo</p>
      <form id="loginForm" onsubmit="return app.login(event)">
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" placeholder="admin / teacher / student" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required />
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
        </div>
        <p class="login-hint">测试账号：admin(管理员) / teacher(老师) / student(学生)<br/>默认密码均为：xxx123</p>
      </form>
      <p id="loginError" class="login-error hidden"></p>
    </div>
  </div>

  <!-- ====== 题目列表页 ====== -->
  <div id="page-questions" class="page hidden">
    <div class="container">
      <h2>题目列表</h2>
      <div id="questionsLoading" class="loading">加载中...</div>
      <div id="questionsError" class="error-box hidden"></div>
      <div id="questionsList" class="questions-list"></div>
    </div>
  </div>

  <!-- ====== 题目表单页 ====== -->
  <div id="page-question-form" class="page hidden">
    <div class="container">
      <h2 id="questionFormTitle">新增题目</h2>
      <div id="questionFormError" class="error-box hidden"></div>
      <form id="questionForm" onsubmit="return false">
        <input type="hidden" id="questionId" />
        <div class="form-group">
          <label for="qContent">题干</label>
          <textarea id="qContent" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label>题型</label>
          <label class="radio-label"><input type="radio" name="qType" value="single_choice" checked /> 选择题</label>
          <label class="radio-label"><input type="radio" name="qType" value="short_answer" /> 简答题</label>
        </div>
        <div class="form-group" id="qOptionsSection">
          <label>选项</label>
          <div id="qOptionsContainer"></div>
          <button type="button" class="btn btn-sm btn-secondary" onclick="QuestionFormPage.addOption('', '')">+ 添加选项</button>
        </div>
        <div class="form-group">
          <label for="qAnswer">答案</label>
          <input type="text" id="qAnswer" placeholder="选择题填选项 label（如 A），简答题填文本" required />
        </div>
        <div class="form-group">
          <label for="qAnalysis">解析</label>
          <textarea id="qAnalysis" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="qKnowledge">知识点（用逗号分隔）</label>
          <input type="text" id="qKnowledge" placeholder="例如：一元一次方程, 等式性质" />
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="questionSaveBtn">保 存</button>
          <button type="button" class="btn btn-secondary" id="questionCancelBtn">取 消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ====== 对话页 ====== -->
  <div id="page-chat" class="page hidden">
    <div class="container chat-layout">
      <div class="chat-header">
        <button class="btn btn-sm" onclick="app.navigate('#questions')">← 返回列表</button>
        <h2 id="chatQuestionTitle">题目详情</h2>
      </div>

      <!-- 题目详情区 -->
      <div id="questionDetail" class="question-detail">
        <div id="detailLoading" class="loading">加载题目中...</div>
        <div id="detailError" class="error-box hidden"></div>
        <div id="detailContent" class="hidden">
          <p class="q-content" id="qContent"></p>
          <div id="qOptions" class="q-options"></div>
          <div class="q-meta">
            <span class="q-type" id="qType"></span>
            <span class="q-knowledge" id="qKnowledge"></span>
          </div>
          <details class="q-answer">
            <summary>查看答案与解析</summary>
            <p><strong>答案：</strong><span id="qAnswer"></span></p>
            <p><strong>解析：</strong><span id="qAnalysis"></span></p>
          </details>
        </div>
      </div>

      <!-- 对话区 -->
      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="输入你的问题或疑问..." />
        <button class="btn btn-primary" id="chatSendBtn" onclick="app.sendChat()">发送</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/questions.js"></script>
  <script src="/js/question-form.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
